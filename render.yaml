# Render Blueprint — Render dashboard → New → Blueprint → pick this repo.
# Secrets marked sync: false are entered in the dashboard (see apps/api/.env.example).
services:
  - type: web
    name: clinic-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev &&npm run build -w @clinic/shared && npm run build -w @clinic/api
    # Migrations run before every start (single instance, so no race).
    startCommand: npm run db:migrate:prod -w @clinic/api && npm run start -w @clinic/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: WEB_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      # Copy this from the dashboard to create the first admin at /setup.
      - key: SETUP_TOKEN
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: Clinic Appointments
      - key: DEFAULT_CLINIC_TIMEZONE
        value: Asia/Manila

  # Frontend (static site, free). /api/* is proxied to the API so cookies stay same-origin.
  - type: web
    name: clinic-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run build -w @clinic/shared && npm run build -w @clinic/web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://clinic-api-o83z.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_CLINIC_NAME
        value: Clinic Appointments
