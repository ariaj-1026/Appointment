# Render Blueprint — Render dashboard → New → Blueprint → pick this repo.
# Secrets marked sync: false are entered in the dashboard (see apps/api/.env.example).
services:
  - type: web
    name: clinic-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build -w @clinic/shared && npm run build -w @clinic/api
    startCommand: npm run start -w @clinic/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: WEB_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: DEFAULT_CLINIC_TIMEZONE
        value: Asia/Manila
  # Reminder cron (24h + 2h) is added in Phase 5.
