# Sends the 24h and 2h appointment reminder emails.
#
# Calls POST /api/cron/reminders every 30 minutes. Each reminder is sent once
# per appointment, so late or repeated runs are harmless (GitHub may delay
# scheduled runs by a few minutes under load).
#
# Setup: repo → Settings → Secrets and variables → Actions:
#   APP_URL      https://<your-app>.vercel.app   (no trailing slash)
#   CRON_SECRET  same value as CRON_SECRET on Render
name: Appointment reminders

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger reminder dispatch
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets are not set; skipping."
            exit 0
          fi
          # Render's free tier sleeps; allow time for a cold start.
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST "$APP_URL/api/cron/reminders" \
            -H "authorization: Bearer $CRON_SECRET"
